set timeout=4
set default=0

insmod part_gpt
insmod fat
insmod search
insmod chain

menuentry "SteamOS" {
    search --no-floppy --fs-uuid --set=root 534D-CE0B
    chainloader /EFI/STEAMOS/STEAMCL.EFI
}

menuentry "Windows" {
    search --no-floppy --fs-uuid --set=root 9AF8-CE51
    chainloader /EFI/Microsoft/Boot/bootmgfw.efi
}